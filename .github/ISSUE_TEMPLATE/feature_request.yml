name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then your proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow or goal, not the feature name
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
    validations:
      required: false
